name: Build Scheduler - prd

on:
  push:
    branches: [main]

jobs:
  build:
    uses: team-monolith-product/tmn-gh-actions/.github/workflows/build_v2.yml@main
    with:
      env: prd
      target: main
      helmRepository: jce-jupyter-hub-helm
      dockerTarget: runtime
      buildArgs: |
        ARCH=amd64
      propertyPath: 'jupyterhub-1.scheduling.userScheduler.image.tag'
      updateTargets: |
        {
          "aws": {
            "imageName": "tmn-ecr-k8s-scheduler",
            "valueFilePath": ["aws-apne2-prd-jupyter.yaml", "aws-euw2-prd-jupyter.yaml", "aws-mes1-prd-jupyter.yaml"]
          },
          "ncp": {
            "registry": "ped-cr-all-prd.ncr.gov-ntruss.com",
            "imageName": "tmn-ecr-k8s-scheduler",
            "valueFilePath": ["ncloud-prd.yaml"]
          }
        }
    secrets:
      NCP_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY_ID }}
      NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
      MACHINE_TOKEN: ${{ secrets.MACHINE_TOKEN }}
